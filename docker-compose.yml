services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: packster
      POSTGRES_PASSWORD: packster
      POSTGRES_DB: packster
    ports:
      - "5432:5432"
    volumes:
      - packster_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U packster -d packster"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: go-backend/Dockerfile
    environment:
      DATABASE_URL: postgres://packster:packster@postgres:5432/packster?sslmode=disable
      FRONTEND_ORIGIN: http://localhost:3000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://localhost:8080/api/auth/google/callback}
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "3000:8080"
    depends_on:
      - backend

volumes:
  packster_pg_data:
